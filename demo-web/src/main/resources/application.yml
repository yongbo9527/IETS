spring:
  datasource:
    username: root
    password: root
    url: jdbc:mysql://192.168.231.189:3306/balance
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto # 主键策略，自增
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #开启sql日志

# jackson时间格式化
jackson:
  time-zone: GMT+8
  date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8081
  servlet:
    context-path: /balance
