spring:
  profiles:
    active: dev
  datasource:
    username: root
    password: admin
    url: jdbc:mysql://localhost:3308/balance?serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  secret: mySecretKeyForIETS2024
  expire-hours: 24
  expire-minutes: 120
  remember-me-minutes: 10080

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto # 主键策略，自增
      # 默认数据库表下划线命名
      table-underline: true
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #开启sql日志
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

# jackson时间格式化
jackson:
  time-zone: GMT+8
  date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8081
  servlet:
    context-path: /balance
